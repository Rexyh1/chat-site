<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Chat Site</title>

  <!-- Firebase Core -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

  <!-- Firebase Authentication -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

  <!-- Firebase UI -->
  <script src="https://www.gstatic.com/firebasejs/ui/6.1.0/firebase-ui-auth.js"></script>

  <!-- Firebase UI CSS -->
  <link
    rel="stylesheet"
    href="https://www.gstatic.com/firebasejs/ui/6.1.0/firebase-ui-auth.css"
  />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f0f2f5;
    }

    header {
      background: #1877f2;
      color: white;
      padding: 15px;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
    }

    #loader {
      text-align: center;
      margin-top: 30px;
      font-size: 18px;
    }

    #firebaseui-auth-container {
      margin-top: 40px;
    }

    #user-info {
      display: none;
      text-align: center;
      margin-top: 40px;
    }

    #user-name {
      margin: 15px 0;
      font-size: 20px;
      color: #333;
    }

    button {
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      background: red;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: darkred;
    }

    .chat-box {
      width: 90%;
      max-width: 600px;
      margin: 30px auto;
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
    }

    .message {
      background: #e4e6eb;
      padding: 10px;
      border-radius: 8px;
      margin-top: 10px;
      text-align: left;
    }
  </style>
</head>

<body>

  <header>My Chatting Site</header>

  <!-- Loading -->
  <div id="loader">Loading...</div>

  <!-- Firebase Login -->
  <div id="firebaseui-auth-container"></div>

  <!-- User Section -->
  <div id="user-info">

    <h2>Welcome</h2>

    <p id="user-name"></p>

    <button onclick="logout()">Logout</button>

    <!-- Fake Chat Area -->
    <div class="chat-box">

      <h3>Chat Room</h3>

      <div class="message">
        Welcome to your new chat app 🎉
      </div>

      <div class="message">
        Firebase Authentication is working ✅
      </div>

    </div>

  </div>

  <script>

    // Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyBOvdxASX7bMj_opJIrrTLtVHtP9Q9vhaQ",
      authDomain: "chatting-site-e4a95.firebaseapp.com",
      projectId: "chatting-site-e4a95",
      storageBucket: "chatting-site-e4a95.firebasestorage.app",
      messagingSenderId: "310064217346",
      appId: "1:310064217346:web:5c1c1f29d486a3a120d61b"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);

    // Firebase UI
    const ui = new firebaseui.auth.AuthUI(firebase.auth());

    // Firebase UI Config
    const uiConfig = {

      signInSuccessUrl: "./",

      signInOptions: [

        // Google Login
        firebase.auth.GoogleAuthProvider.PROVIDER_ID,

        // Email Login
        firebase.auth.EmailAuthProvider.PROVIDER_ID

      ],

      callbacks: {

        signInSuccessWithAuthResult: function(authResult, redirectUrl) {
          return false;
        },

        uiShown: function() {
          document.getElementById("loader").style.display = "none";
        }

      }

    };

    // Start Firebase UI
    ui.start("#firebaseui-auth-container", uiConfig);

    // Check Login State
    firebase.auth().onAuthStateChanged(function(user) {

      if (user) {

        // Show user section
        document.getElementById("user-info").style.display = "block";

        // Hide login section
        document.getElementById("firebaseui-auth-container").style.display = "none";

        // Show username
        document.getElementById("user-name").innerHTML =
          "Logged in as: " + user.displayName;

      } else {

        // Hide user section
        document.getElementById("user-info").style.display = "none";

        // Show login section
        document.getElementById("firebaseui-auth-container").style.display = "block";

      }

    });

    // Logout Function
    function logout() {
      firebase.auth().signOut();
    }

  </script>

</body>
</html>
