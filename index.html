<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat • Rex Awolo</title>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

    <style>
        body { margin:0; font-family:Arial; background:#e5ddd5; height:100vh; overflow:hidden; }
        header { background:#128C7E; color:white; padding:15px; text-align:center; font-size:22px; }
        
        #app { display:flex; height:calc(100vh - 60px); }
        #sidebar { width:320px; background:white; border-right:1px solid #ccc; overflow-y:auto; }
        #chat-area { flex:1; display:flex; flex-direction:column; }

        #messages { flex:1; padding:20px; overflow-y:auto; background:#f0f0f0; }
        .msg {
            margin:10px 0;
            padding:12px 16px;
            border-radius:12px;
            max-width:70%;
        }
        .me { background:#dcf8c6; margin-left:auto; }
        .other { background:white; }

        #input-area {
            padding:15px;
            background:#f0f0f0;
            display:flex;
        }
        #message-input {
            flex:1;
            padding:12px;
            border-radius:20px;
            border:1px solid #ccc;
        }
        button {
            margin-left:10px;
            padding:12px 25px;
            background:#128C7E;
            color:white;
            border:none;
            border-radius:20px;
        }
    </style>
</head>
<body>

<header>💬 Simple Chat</header>

<div id="app">
    <!-- Sidebar -->
    <div id="sidebar">
        <h3 style="padding:15px; background:#f0f0f0;">Users</h3>
        <div id="users-list"></div>
    </div>

    <!-- Chat Area -->
    <div id="chat-area">
        <div id="chat-header" style="background:#128C7E; color:white; padding:15px;">
            Select a user to start chatting
        </div>
        <div id="messages"></div>
        <div id="input-area">
            <input type="text" id="message-input" placeholder="Type a message...">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>
</div>

<script>
// ================== FIREBASE CONFIG ==================
const firebaseConfig = {
    apiKey: "AIzaSyBOvdxASX7bMj_opJIrrTLtVHtP9Q9vhaQ",
    authDomain: "chatting-site-e4a95.firebaseapp.com",
    databaseURL: "https://chatting-site-e4a95-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "chatting-site-e4a95",
    storageBucket: "chatting-site-e4a95.firebasestorage.app",
    messagingSenderId: "310064217346",
    appId: "1:310064217346:web:5c1c1f29d486a3a120d61b"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let currentUser = null;
let currentUsername = "";
let activeChatId = null;

// Auth
firebase.auth().onAuthStateChanged(user => {
    if (user) {
        currentUser = user;
        initUser();
    }
});

function initUser() {
    db.ref("users/" + currentUser.uid).once("value", snap => {
        if (snap.exists()) {
            currentUsername = snap.val().username;
            loadUsers();
        } else {
            let name = prompt("Choose your username:");
            if (name) registerUsername(name);
        }
    });
}

function registerUsername(name) {
    db.ref("usernames/" + name).once("value", snap => {
        if (snap.exists()) {
            alert("Username taken! Try another.");
            let newName = prompt("New username:");
            if (newName) registerUsername(newName);
        } else {
            db.ref("usernames/" + name).set(currentUser.uid);
            db.ref("users/" + currentUser.uid).set({ username: name });
            currentUsername = name;
            loadUsers();
        }
    });
}

function loadUsers() {
    const list = document.getElementById("users-list");
    db.ref("users").on("value", snap => {
        list.innerHTML = "";
        snap.forEach(child => {
            if (child.key === currentUser.uid) return;
            const user = child.val();
            const div = document.createElement("div");
            div.style.padding = "15px";
            div.style.borderBottom = "1px solid #eee";
            div.style.cursor = "pointer";
            div.innerHTML = `<strong>${user.username}</strong>`;
            div.onclick = () => openChat(child.key, user.username);
            list.appendChild(div);
        });
    });
}

function openChat(otherUid, otherName) {
    activeChatId = [currentUser.uid, otherUid].sort().join("_");
    document.getElementById("chat-header").innerHTML = `Chatting with <strong>${otherName}</strong>`;
    loadMessages();
}

function loadMessages() {
    if (!activeChatId) return;
    const messagesDiv = document.getElementById("messages");

    db.ref("chats/" + activeChatId).on("value", snap => {
        messagesDiv.innerHTML = "";
        snap.forEach(m => {
            const msg = m.val();
            const div = document.createElement("div");
            div.className = `msg ${msg.uid === currentUser.uid ? 'me' : 'other'}`;
            div.innerHTML = `<strong>${msg.name}:</strong><br>${msg.text}`;
            messagesDiv.appendChild(div);
        });
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    });
}

function sendMessage() {
    const input = document.getElementById("message-input");
    const text = input.value.trim();

    if (!text) return alert("Type a message");
    if (!activeChatId) return alert("Please select a user first");

    db.ref("chats/" + activeChatId).push({
        text: text,
        uid: currentUser.uid,
        name: currentUsername,
        time: Date.now()
    });

    input.value = "";
}

// Enter key
document.getElementById("message-input").addEventListener("keypress", e => {
    if (e.key === "Enter") sendMessage();
});
</script>

</body>
</html>
